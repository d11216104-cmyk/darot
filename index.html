    <title>塔羅牌抽牌應用</title>
    <style>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .control-group {
            flex: 1;
            min-width: 150px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }

        .control-group input[type="number"],
        .control-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .control-group input[type="number"]:focus,
        .control-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 28px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-weight: 600;
            color: #495057;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

            color: white;
        }

            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

            transform: translateY(-2px);
        }

        .status {
            padding: 15px 30px;
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            color: #004085;
            font-weight: 500;
        }

        .status[aria-live="polite"] {
            min-height: 50px;
        }

        .results {
            padding: 30px;
            min-height: 200px;
        }

        .results-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .results-header h2 {

            gap: 10px;

            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            color: #495057;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);

            margin-bottom: 15px;
            padding-bottom: 10px;

            background: #667eea;

            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .card-orientation {

            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;

            background: #d4edda;
            color: #155724;

            color: #721c24;

        .card-name {

            font-weight: bold;
            color: #495057;
            margin-bottom: 10px;

            font-size: 0.95rem;

            text-align: center;
            padding: 60px 20px;
            color: #6c757d;

            height: 120px;
            margin-bottom: 20px;

            font-size: 1.5rem;

                align-items: stretch;
            }

            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;

        // ==================== PRNG Implementation ====================
        
        /**
         * cyrb53 - Simple string hashing function
         * Converts any string to a 53-bit hash number
         */
        function cyrb53(str, seed = 0) {
            let h1 = 0xdeadbeef ^ seed;
            let h2 = 0x41c6ce57 ^ seed;
            for (let i = 0, ch; i < str.length; i++) {
                ch = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return 4294967296 * (2097151 & h2) + (h1 >>> 0);
        }

        /**
         * Mulberry32 - Deterministic PRNG
         * Returns a function that generates pseudo-random numbers in range [0, 1)
         */
        function mulberry32(seed) {
            return function() {
                seed |= 0;
                seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        /**
         * Generate a high-entropy random seed using crypto.getRandomValues
         */
        function generateRandomSeed() {
            const array = new Uint32Array(4);
            window.crypto.getRandomValues(array);
            return Array.from(array, num => num.toString(36)).join('');
        }

        /**
         * Fisher-Yates (Knuth) shuffle algorithm
         * Shuffles array in place using provided PRNG
         */
        function shuffleArray(array, prng) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(prng() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // ==================== Card Drawing Logic ====================
        
        /**
         * Draw cards with specified parameters
         * @param {number} count - Number of cards to draw (1-10)
         * @param {boolean} allowReversed - Whether to allow reversed cards
         * @param {string} seed - Seed for reproducibility (optional)
         * @returns {Object} Reading result with seed and cards
         */
        function drawCards(count, allowReversed, seed) {
            // Validate count
            count = Math.max(1, Math.min(10, Math.floor(count)));
            
            // Generate or use provided seed
            const usedSeed = seed || generateRandomSeed();
            
            // Initialize PRNG with seed
            const seedHash = cyrb53(usedSeed);
            const prng = mulberry32(seedHash);
            
            // Shuffle deck
            const shuffledDeck = shuffleArray(MAJOR_ARCANA, prng);
            
            // Draw cards
            const drawnCards = shuffledDeck.slice(0, count);
            
            // Determine orientation for each card
            const result = drawnCards.map((card, index) => {
                let orientation = 'upright';
                if (allowReversed) {
                    // 50% chance for reversed
                    orientation = prng() < 0.5 ? 'upright' : 'reversed';
                }
                
                return {
                    position: index + 1,
                    cardId: card.id,
                    name: card.name,
                    orientation: orientation,
                    description: orientation === 'upright' ? card.upright : card.reversed
                };
            });
            
            return {
                seed: usedSeed,
                cards: result
            };
        }

        // ==================== UI Functions ====================
        
        /**
         * Render the reading results
         */
        function renderResults(reading) {
            const container = document.getElementById('resultsContainer');
            
            let html = `
                <div class="results-header">
                    <h2>抽牌結果</h2>
                    <div class="seed-info">
                        <span>種子 (Seed):</span>
                        <span class="seed-value">${escapeHtml(reading.seed)}</span>
                        <span>· 張數: ${reading.cards.length}</span>
                    </div>
                </div>
                <div class="cards-grid">
            `;
            
            reading.cards.forEach(card => {
                const orientationClass = card.orientation === 'upright' ? 'orientation-upright' : 'orientation-reversed';
                const orientationText = card.orientation === 'upright' ? '正位' : '逆位';
                
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-position" aria-label="位置 ${card.position}">${card.position}</div>
                            <div class="card-orientation ${orientationClass}">${orientationText}</div>
                        </div>
                        <div class="card-name">${escapeHtml(card.name)}</div>
                        <div class="card-description">${escapeHtml(card.description)}</div>
                    </div>
                `;
            });
            
            html += `</div>`;
            
            container.innerHTML = html;
        }

        /**

        function showEmptyState() {

            `;
        }

        /**
         * Update status message
         */
        function setStatus(message) {
            document.getElementById('statusMessage').textContent = message;
        }

        /**
         * Escape HTML to prevent XSS
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * Validate card count input
         */
        function validateCardCount(value) {
            const num = parseInt(value, 10);
            if (isNaN(num) || num < 1) return 1;
            if (num > 10) return 10;
            return num;
        }

        // ==================== Event Handlers ====================
        
        /**
         * Handle draw button click
         */
        async function handleDraw() {
            const drawButton = document.getElementById('drawButton');
            const cardCountInput = document.getElementById('cardCount');
            const seedInput = document.getElementById('seedInput');
            const allowReversedCheckbox = document.getElementById('allowReversed');
            
            // Validate and get inputs
            const count = validateCardCount(cardCountInput.value);
            cardCountInput.value = count; // Update with validated value
            
            const seed = seedInput.value.trim();
            const allowReversed = allowReversedCheckbox.checked;
            
            // Disable button during processing
            drawButton.disabled = true;
            setStatus('抽牌中...');
            
            try {
                // Simulate brief processing time for better UX
                await new Promise(resolve => setTimeout(resolve, 100));
                
                // Draw cards
                const reading = drawCards(count, allowReversed, seed);
                
                // Update seed input with used seed if it was auto-generated
                if (!seed) {
                    seedInput.value = reading.seed;
                }
                
                // Render results
                renderResults(reading);
                
                // Update status
                const reversedText = allowReversed ? '允許逆位' : '僅正位';
                setStatus(`已抽取 ${reading.cards.length} 張牌 (${reversedText}) · 種子: ${reading.seed}`);
                
            } catch (error) {
                console.error('抽牌時發生錯誤:', error);
                setStatus('發生錯誤，請重試');
            } finally {
                // Re-enable button
                drawButton.disabled = false;
            }
        }

        /**
         * Handle reset button click
         */
        function handleReset() {
            // Reset inputs
            document.getElementById('cardCount').value = 3;
            document.getElementById('seedInput').value = '';
            document.getElementById('allowReversed').checked = true;
            
            // Clear results
            showEmptyState();
            
            // Reset status
            setStatus('準備就緒，請設定參數後點擊「抽牌」按鈕');
        }

        // ==================== Initialization ====================
        
        document.addEventListener('DOMContentLoaded', () => {
            // Attach event listeners
            document.getElementById('drawButton').addEventListener('click', handleDraw);
            document.getElementById('resetButton').addEventListener('click', handleReset);
            
            // Allow Enter key to trigger draw
            document.getElementById('cardCount').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleDraw();
            });
            
            document.getElementById('seedInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleDraw();
            });
            
            // Validate card count on input
            document.getElementById('cardCount').addEventListener('input', (e) => {
                const value = validateCardCount(e.target.value);
                if (value !== parseInt(e.target.value, 10)) {
                    e.target.value = value;
                }
            });
            
            console.log('塔羅牌應用已初始化');
            console.log(`已載入 ${MAJOR_ARCANA.length} 張大阿爾克那牌`);
        });
    </script>
</body>
</html>
