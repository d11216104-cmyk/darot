<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 (Gomoku)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .player-stone {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid #333;
        }

        .black-stone {
            background: #000;
        }

        .white-stone {
            background: #fff;
        }

        .active-player {
            background: #fffacd;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ffd700;
        }

        #board {
            display: inline-block;
            background: #daa520;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(15, 35px);
            grid-template-rows: repeat(15, 35px);
            gap: 0;
            background: #cd9a3c;
            padding: 10px;
            position: relative;
        }

        .cell {
            width: 35px;
            height: 35px;
            border: 1px solid #8b6914;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #cd9a3c;
        }

        .cell:hover:not(.occupied) {
            background: rgba(255, 255, 255, 0.2);
        }

        .stone {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #333;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }

        .stone.black {
            background: radial-gradient(circle at 30% 30%, #666, #000);
        }

        .stone.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ddd);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
        }

        .btn-restart {
            background: #4CAF50;
            color: white;
        }

        .btn-restart:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        #message {
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            min-height: 30px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
        }

        .win-message {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #d35400;
            animation: pulse 1s infinite;
        }

        .draw-message {
            background: #95a5a6;
            color: white;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>五子棋</h1>
        <div class="subtitle">15×15 雙人對戰</div>
        
        <div class="game-info">
            <div class="player-info" id="player1-info">
                <span class="player-stone black-stone"></span>
                <span>玩家 1 (黑)</span>
            </div>
            <div class="player-info" id="player2-info">
                <span class="player-stone white-stone"></span>
                <span>玩家 2 (白)</span>
            </div>
        </div>

        <div class="board-container">
            <div id="board">
                <div class="board-grid" id="boardGrid"></div>
            </div>
        </div>

        <div id="message"></div>

        <div class="controls">
            <button class="btn-restart" onclick="restartGame()">重新開始</button>
        </div>
    </div>

    <div class="footer">
        純網頁版五子棋 - 無需服務器
    </div>

    <script>
        const SIZE = 15;
        const EMPTY = 0;
        const P1 = 1;  // 黑
        const P2 = 2;  // 白

        let board = [];
        let currentPlayer = P1;
        let moves = 0;
        let gameOver = false;

        function initBoard() {
            board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(EMPTY));
            currentPlayer = P1;
            moves = 0;
            gameOver = false;
            updatePlayerIndicator();
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = '';
        }

        function createBoard() {
            const boardGrid = document.getElementById('boardGrid');
            boardGrid.innerHTML = '';
            
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.onclick = () => makeMove(r, c);
                    boardGrid.appendChild(cell);
                }
            }
        }

        function makeMove(r, c) {
            if (gameOver || board[r][c] !== EMPTY) {
                return;
            }

            board[r][c] = currentPlayer;
            moves++;
            updateCell(r, c);

            if (isWin(r, c)) {
                gameOver = true;
                const playerName = currentPlayer === P1 ? '玩家 1 (黑)' : '玩家 2 (白)';
                showMessage(`${playerName} 獲勝！`, 'win-message');
                return;
            }

            if (moves >= SIZE * SIZE) {
                gameOver = true;
                showMessage('平手（棋盤已滿）', 'draw-message');
                return;
            }

            currentPlayer = currentPlayer === P1 ? P2 : P1;
            updatePlayerIndicator();
        }

        function updateCell(r, c) {
            const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
            cell.classList.add('occupied');
            
            const stone = document.createElement('div');
            stone.className = 'stone ' + (board[r][c] === P1 ? 'black' : 'white');
            cell.appendChild(stone);
        }

        function updatePlayerIndicator() {
            const p1Info = document.getElementById('player1-info');
            const p2Info = document.getElementById('player2-info');
            
            if (currentPlayer === P1) {
                p1Info.classList.add('active-player');
                p2Info.classList.remove('active-player');
            } else {
                p2Info.classList.add('active-player');
                p1Info.classList.remove('active-player');
            }
        }

        function inBounds(r, c) {
            return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
        }

        function countDir(r, c, dr, dc, stone) {
            let cnt = 0;
            let rr = r, cc = c;
            while (inBounds(rr, cc) && board[rr][cc] === stone) {
                cnt++;
                rr += dr;
                cc += dc;
            }
            return cnt;
        }

        function isWin(r, c) {
            const stone = board[r][c];
            if (stone === EMPTY) return false;

            const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
            for (const [dr, dc] of directions) {
                const total = countDir(r, c, dr, dc, stone) + 
                             countDir(r, c, -dr, -dc, stone) - 1;
                if (total >= 5) return true;
            }
            return false;
        }

        function showMessage(text, className) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = className;
        }

        function restartGame() {
            initBoard();
            createBoard();
        }

        // 初始化遊戲
        window.onload = () => {
            initBoard();
            createBoard();
        };
    </script>
</body>
</html>
